name: EPIC
description: Define a coordinated outcome and its boundaries.
title: 'EPIC: '
labels:
- type:epic
- epic
- needs-triage
body:
- type: markdown
  attributes:
    value: Search existing issues first. Classification does not schedule work. A
      parent URL records intent; maintainers must establish and verify the native
      sub-issue relationship.
- type: textarea
  id: outcome
  attributes:
    label: Outcome and value
  validations:
    required: true
- type: textarea
  id: scope
  attributes:
    label: Scope and exclusions
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
  validations:
    required: true
- type: textarea
  id: children
  attributes:
    label: Proposed child issues and dependencies
  validations:
    required: true
