name: Story
description: Define a bounded user outcome.
title: 'Story: '
labels:
- type:story
- user-story
- needs-triage
body:
- type: markdown
  attributes:
    value: Search existing issues first. Classification does not schedule work. A
      parent URL records intent; maintainers must establish and verify the native
      sub-issue relationship.
- type: textarea
  id: outcome
  attributes:
    label: User need and outcome
  validations:
    required: true
- type: textarea
  id: acceptance
  attributes:
    label: Acceptance criteria
  validations:
    required: true
- type: textarea
  id: parent
  attributes:
    label: Parent epic URL, or standalone rationale
  validations:
    required: true
- type: textarea
  id: dependencies
  attributes:
    label: Dependencies and constraints
  validations:
    required: true
