name: Bug Report
description: Report a template, website, integration or repository defect.
title: 'Bug: '
labels:
- type:bug
- bug
- needs-triage
body:
- type: markdown
  attributes:
    value: |
      Thanks for taking the time to report a problem. This issue is public; do
      not include confidential, personal, proprietary, or security-sensitive
      information. Report vulnerabilities using the private route in
      SECURITY.md, not this form.
- type: input
  id: template
  attributes:
    label: Affected component or URL
    description: Name the template, page, integration, command or workflow. Include
      a URL or path when available.
  validations:
    required: true
- type: textarea
  id: what-happened
  attributes:
    label: Expected and observed behavior
    description: What did you expect, and what happened instead?
  validations:
    required: true
- type: input
  id: affected-version
  attributes:
    label: Affected version or revision (optional)
    description: Include the template version, release, or commit if known.
- type: dropdown
  id: methodology
  attributes:
    label: Methodology
    description: Which methodology does this template belong to?
    options:
    - Not applicable / Not sure
    - Traditional
    - Agile
    - Hybrid
    default: 0
  validations:
    required: false
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Provide steps, environment and observed result. If reproduction is
      unavailable, explain why and provide the evidence you have.
    placeholder: '1. Go to...

      2. Click on...

      3. See error...

      '
  validations:
    required: false
- type: textarea
  id: additional-context
  attributes:
    label: Additional context
    description: Add any other context about the problem here
  validations:
    required: false
