name: Bug Report
description: Report a template, website, integration or repository defect.
title: 'Bug: '
labels:
- type:bug
- bug
- needs-triage
body:
- type: markdown
  attributes:
    value: 'Thanks for taking the time to fill out this bug report!

      '
- type: input
  id: template
  attributes:
    label: Affected component or URL
    description: Name the template, page, integration, command or workflow. Include
      a URL or path when available.
  validations:
    required: true
- type: textarea
  id: what-happened
  attributes:
    label: What happened?
    description: Also tell us, what did you expect to happen?
    placeholder: Tell us what you see!
  validations:
    required: true
- type: dropdown
  id: methodology
  attributes:
    label: Methodology
    description: Which methodology does this template belong to?
    options:
    - Not applicable / Not sure
    - Traditional
    - Agile
    - Hybrid
    default: 0
  validations:
    required: false
- type: textarea
  id: steps
  attributes:
    label: Steps to reproduce
    description: Provide steps, environment and observed result. If reproduction is
      unavailable, explain why and provide the evidence you have.
    placeholder: '1. Go to...

      2. Click on...

      3. See error...

      '
  validations:
    required: true
- type: textarea
  id: additional-context
  attributes:
    label: Additional context
    description: Add any other context about the problem here
  validations:
    required: false
