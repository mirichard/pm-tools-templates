name: Suggest a template correction
description: Identify an existing template/version and propose a targeted change.
title: "Correction: "
labels:
  - type:candidate
  - enhancement
  - template-improvement
  - community-feedback
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        This issue and any attachments are public. Do not include confidential,
        personal, proprietary, or identifying information. Only upload sanitized
        files. Contributors do not need to convert file formats; maintainers
        assess and convert or retain files as appropriate.
  - type: input
    id: template
    attributes:
      label: Affected template and version
      description: Provide the name, path or link, and version/revision if known.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: What is wrong or missing?
      description: Describe the observed behavior or content and the expected result.
    validations:
      required: true
  - type: textarea
    id: proposed-change
    attributes:
      label: Proposed correction
      description: Describe the targeted change. A finished replacement is not required.
    validations:
      required: true
  - type: upload
    id: supporting-files
    attributes:
      label: Optional sanitized supporting files
      description: Attachments are public. Do not upload unsanitized originals.
    validations:
      required: false
  - type: input
    id: related-work
    attributes:
      label: Related or duplicate issue (optional)
