name: Request a template or capability
description: Tell us the need and intended outcome; no finished assets or estimates required.
title: "Request: "
labels:
  - type:candidate
  - enhancement
  - template-request
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        Requests are evaluated for fit and duplicates. Acceptance does not set a
        delivery date. This issue is public; do not include confidential,
        personal, proprietary, or identifying information or attach files.
  - type: textarea
    id: need
    attributes:
      label: What need are you trying to meet?
      description: Describe the problem or capability gap in your own words.
    validations:
      required: true
  - type: textarea
    id: intended-user
    attributes:
      label: Who would use this and what would they accomplish?
    validations:
      required: true
  - type: textarea
    id: example-outcome
    attributes:
      label: Example outcome (optional)
      description: What would a useful result look like?
  - type: textarea
    id: alternatives
    attributes:
      label: Existing template, workaround, or related request (optional)
      description: Add a link if one is relevant; maintainers will assess duplicates.
