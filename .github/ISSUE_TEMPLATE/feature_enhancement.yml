name: Product idea or enhancement — start here
description: Propose a new capability or improvement for evaluation; no delivery commitment.
title: 'Candidate: '
labels:
- type:candidate
- enhancement
- needs-triage
body:
- type: markdown
  attributes:
    value: Use this form for product ideas and enhancements. Use Template Request
      only for a specific new template, Template Improvement for changes to one existing
      template, or Bug Report for behavior that is broken. Maintainers decide priority
      and scheduling after triage.
- type: textarea
  id: problem
  attributes:
    label: Problem and intended users
    description: Who has this problem, and what are they trying to accomplish?
  validations:
    required: true
- type: textarea
  id: outcome
  attributes:
    label: Proposed outcome
    description: Describe the improvement and how you would recognize success.
  validations:
    required: true
- type: dropdown
  id: area
  attributes:
    label: Area
    default: 0
    options:
    - Not sure / Other
    - Templates and guidance
    - Website and user experience
    - Integrations and automation
    - Analytics and AI
    - Community and contribution
    - Repository tooling
  validations:
    required: true
- type: textarea
  id: impact
  attributes:
    label: Impact and timing (optional)
    description: Describe affected users, workarounds and any external deadline. This
      does not set repository priority.
- type: checkboxes
  id: duplicates
  attributes:
    label: Existing work
    options:
    - label: I searched existing issues for related requests and included any relevant
        links.
      required: true
