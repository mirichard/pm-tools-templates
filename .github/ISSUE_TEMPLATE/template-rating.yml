name: Rate a template or provide feedback
description: Share a low-effort rating or optional feedback about a template.
title: "Feedback: "
labels:
  - type:operational
  - template-rating
  - community-feedback
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. Do not include confidential, personal, proprietary,
        or identifying information. Ratings are self-reported feedback, not
        verified evidence of adoption or template quality. Actionable feedback
        may be linked to a correction, request, or problem report.
  - type: input
    id: template
    attributes:
      label: Template (optional)
      description: Name or link; include a version if relevant.
  - type: dropdown
    id: rating
    attributes:
      label: Your rating (optional)
      options:
        - Excellent
        - Good
        - Fair
        - Poor
        - Not sure
    validations:
      required: false
  - type: textarea
    id: feedback
    attributes:
      label: Feedback (optional)
      description: What worked, or what should be improved?
