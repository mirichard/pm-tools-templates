# Dependabot configuration for PM Tools & Templates
# Monitors for security vulnerabilities and keeps dependencies updated

version: 2
updates:
  # Monitor GitHub Actions for security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"

  # Monitor npm packages if any JavaScript tools are added
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"
    ignore:
      # Ignore patch updates for now, focus on security
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Monitor Python packages if any automation tools are added
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"

  # Monitor the container image build for ai-insights, the one sub-app with a
  # live Dockerfile.
  - package-ecosystem: "docker"
    directory: "/ai-insights"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"

  # Sub-applications each have their own dependency tree; previously only the
  # repo root was watched, so their npm dependencies were invisible here.
  - package-ecosystem: "npm"
    directory: "/dashboard-mvp"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    labels: [ "dependencies", "security" ]
    commit-message: { prefix: "Security", include: "scope" }
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]

