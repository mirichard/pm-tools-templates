# Dependabot configuration for PM Tools & Templates
# Monitors for security vulnerabilities and keeps dependencies updated

version: 2
updates:
  # Monitor GitHub Actions for security updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"

  # Monitor npm packages if any JavaScript tools are added
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"
    ignore:
      # Ignore patch updates for now, focus on security
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  # Monitor Python packages if any automation tools are added
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "Security"
      include: "scope"

  # Sub-applications each have their own dependency tree; previously only the
  # repo root was watched, so their npm dependencies were invisible here.
  # One entry with `directories:` (GA since mid-2024) instead of 10 separate
  # `directory:` entries, so a future policy change (labels, schedule, ignore
  # rules) only needs to be made once instead of kept in sync across 10 copies.
  - package-ecosystem: "npm"
    directories:
      - "/integrations/webhook-framework"
      - "/dashboard-mvp"
      - "/web-mvp"
      - "/site"
      - "/analytics-platform"
      - "/workflow-orchestration"
      - "/backend"
      - "/tools/requirements-structuring-cli"
      - "/tools/template-generator-cli"
      - "/docs/site"
    groups:
      eslint-toolchain:
        patterns:
          - "eslint"
          - "@eslint/js"
          - "@eslint/eslintrc"
          - "eslint-config-next"
          - "@typescript-eslint/*"
    schedule: { interval: "weekly", day: "monday" }
    open-pull-requests-limit: 5
    labels: [ "dependencies", "security" ]
    commit-message: { prefix: "Security", include: "scope" }
    ignore:
      # Match .github/ci-coverage.json Node 24; revisit with a runtime upgrade.
      - dependency-name: "@types/node"
        versions: [ ">=25" ]
      - dependency-name: "*"
        update-types: [ "version-update:semver-patch" ]

