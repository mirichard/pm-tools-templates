name: Weekly Backlog Triage Automation
on:
  schedule:
    - cron: '0 14 * * 2' # Tuesday 14:00 UTC; no fixed Eastern-time claim
  workflow_dispatch:
    inputs:
      preview:
        description: 'Prepare artifacts without updating the planning digest'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
jobs:
  prepare-triage:
    uses: ./.github/workflows/planning-review.yml
    with:
      preview: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
    secrets:
      ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
