name: Project credential diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect project credential with read-only requests
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
        with:
          script: |
            const token = process.env.PROJECT_TOKEN;
            if (!token) {
              core.setFailed('ROADMAP_PROJECT_TOKEN is missing');
              return;
            }
            core.setSecret(token);
            const result = { identity: null, projects: [] };
            async function readApi(path, body) {
              try {
                const response = await fetch('https://api.github.com' + path, {
                  method: body ? 'POST' : 'GET',
                  headers: {
                    Authorization: 'Bearer ' + token,
                    Accept: 'application/vnd.github+json',
                    'X-GitHub-Api-Version': '2022-11-28',
                    'Content-Type': 'application/json'
                  },
                  body: body ? JSON.stringify(body) : undefined,
                  signal: AbortSignal.timeout(30000)
                });
                const scopes = response.headers.get('x-oauth-scopes');
                const data = await response.json();
                return { status: response.status, scopes, data };
              } catch {
                return { status: null, failure: 'transport_or_response_failure' };
              }
            }
            const identity = await readApi('/user');
            result.identity = {
              status: identity.status,
              login: identity.status === 200 ? identity.data.login : null,
              scopes: identity.scopes ?? null,
              failure: identity.failure ?? null
            };
            const query = 'query($owner:String!,$number:Int!){user(login:$owner){projectV2(number:$number){id number title url public}}}';
            for (const number of [11, 12, 13]) {
              const response = await readApi('/graphql', {
                query, variables: { owner: 'mirichard', number }
              });
              const project = response.data?.data?.user?.projectV2;
              const errors = (response.data?.errors ?? []).map(error => ({
                type: error.type ?? error.extensions?.type ?? 'UNSPECIFIED',
                path: error.path ?? null
              }));
              result.projects.push({
                owner: 'mirichard', number, status: response.status,
                resolved: response.status === 200 && Boolean(project) && errors.length === 0,
                project: project ?? null, errors,
                failure: response.failure ?? null
              });
            }
            core.info(JSON.stringify(result, null, 2));
            await core.summary.addHeading('Project credential diagnostic')
              .addCodeBlock(JSON.stringify(result, null, 2), 'json').write();
            if (result.identity.status !== 200 || result.projects.some(project => !project.resolved)) {
              core.setFailed('Credential diagnostic found an unresolved identity or project read; see sanitized results');
            }
