name: B3C Entry Validation Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: read

jobs:
  export-generated-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate migration metadata
        run: |
          set -euxo pipefail
          node scripts/generate-sprint-10-metadata.mjs
          git diff --name-only -- meta/cross-references.json meta/migration-inventory.json
      - name: Upload regenerated metadata
        uses: actions/upload-artifact@v4
        with:
          name: b3c-generated-metadata
          path: |
            meta/cross-references.json
            meta/migration-inventory.json
          if-no-files-found: error
          retention-days: 1
