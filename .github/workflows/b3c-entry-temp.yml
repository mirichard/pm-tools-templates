name: B3C Entry Validation Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave
    paths:
      - .github/workflows/b3c-entry-temp.yml

permissions:
  contents: write

jobs:
  refresh-generated-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Regenerate migration metadata
        run: |
          set -euxo pipefail
          node scripts/generate-sprint-10-metadata.mjs
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "meta/cross-references.json
meta/migration-inventory.json"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add meta/cross-references.json meta/migration-inventory.json
          git commit -m "chore: commit regenerated migration metadata"
          git push
