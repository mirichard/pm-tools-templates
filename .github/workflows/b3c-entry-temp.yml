name: B3C Entry Validation Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: write

jobs:
  validate-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh deterministic generated metadata if needed
        run: |
          set -euxo pipefail
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3c.json
          node scripts/migration-post-check.mjs
          node scripts/generate-sprint-10-metadata.mjs
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' meta/cross-references.json meta/migration-inventory.json | sort)"
          if [ -z "$changed" ]; then
            echo 'PASS: generated metadata already fresh.'
            exit 0
          fi
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected generated drift set:' >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          node scripts/generate-sprint-10-metadata.mjs
          changed_second="$(git diff --name-only | sort)"
          if [ "$changed_second" != "$expected" ]; then
            echo 'Generator output is not stable across repeated generation.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/cross-references.json meta/migration-inventory.json
          git diff --cached --check
          git commit -m 'chore(migration): refresh generated metadata before B3C'
          git push origin HEAD:feat/b3c-delivery-wave
