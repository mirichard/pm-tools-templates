name: B3C Entry Validation Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: read

jobs:
  validate-entry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose generated metadata freshness
        run: |
          set -euxo pipefail
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3c.json
          node scripts/migration-post-check.mjs
          node scripts/generate-sprint-10-metadata.mjs
          echo '--- GENERATED DRIFT FILES ---'
          git diff --name-only
          echo '--- GENERATED DRIFT STAT ---'
          git diff --stat
          echo '--- STATUS ---'
          git status --short
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' meta/cross-references.json meta/migration-inventory.json | sort)"
          if [ "$changed" != "$expected" ]; then
            echo 'Unexpected generated drift set.' >&2
            exit 1
          fi
          node scripts/generate-sprint-10-metadata.mjs
          changed_second="$(git diff --name-only | sort)"
          if [ "$changed_second" != "$expected" ]; then
            echo 'Generator output is not stable across repeated generation.' >&2
            exit 1
          fi
          echo 'PASS: generated drift is deterministic and limited to the two authoritative metadata artifacts.'
