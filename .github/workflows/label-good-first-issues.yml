name: Label Issue Topics

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  label-issue-topics:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Classify explicit issue topics
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./scripts/issue-label-policy.cjs').labelTopics({
              github, repo: context.repo, number: context.issue.number
            });
