name: Label Issue Topics

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  label-issue-topics:
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Classify issue topics
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const issueBody = issue.body || '';
            const issueTitle = issue.title || '';
            const issueAuthor = issue.user.login;
            
            // Readiness and good-first-issue suitability are maintainer decisions.
            // This workflow only applies topical labels; it never invites work.
            // Also add labels based on content
            const labels = [];
            
            if (/template/i.test(issueTitle + ' ' + issueBody)) {
              labels.push('template-related');
            }
            
            if (/documentation|readme/i.test(issueTitle + ' ' + issueBody)) {
              labels.push('documentation');
            }
            
            if (/bug|error|broken|not.*work/i.test(issueTitle + ' ' + issueBody)) {
              labels.push('bug');
            }
            
            if (/feature.*request|enhancement|improve/i.test(issueTitle + ' ' + issueBody)) {
              labels.push('enhancement');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
