name: Sprint Planning Preparation
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      preview:
        description: 'Preview dates, capacity and readiness without updating the digest'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
jobs:
  prepare-sprint:
    uses: ./.github/workflows/planning-review.yml
    with:
      preview: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
    secrets:
      ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
