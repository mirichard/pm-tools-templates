name: 🚀 Sprint Management Automation

on:
  schedule:
    # Run every Monday at 9 AM UTC (start of sprint week)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      action:
        description: 'Sprint action to perform'
        required: false
        default: 'status'
        type: choice
        options:
          - status
          - metrics

jobs:
  sprint-automation:
    name: Sprint Management
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: 📊 Sprint Status Check
        env:
          SPRINT_ACTION_INPUT: ${{ github.event.inputs.action }}
        run: |
          SPRINT_ACTION="$SPRINT_ACTION_INPUT"
          echo "🚀 Sprint Management System"
          printf 'Action: %s\n' "$SPRINT_ACTION"
          echo "Date: $(date +%Y-%m-%d)"
          echo "Status: Operational"
          echo "✅ Sprint management workflow completed successfully"


