name: B3C Execution Change Set Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Generate B3C execution change set
        run: |
          python3 .github/scripts/b3c-execute-temp.py
          python3 .github/scripts/b3c-fix-pointers-temp.py
          node scripts/generate-sprint-10-metadata.mjs
      - name: Validate generated executed state
        run: |
          set -euxo pipefail
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3c.json
          node scripts/migration-post-check.mjs
          node scripts/generate-sprint-10-metadata.mjs
          git diff --exit-code -- meta/cross-references.json meta/migration-inventory.json
          node scripts/validate-sprint-10.mjs --require-annotations
          node scripts/validate-curated-templates.js
          node scripts/validate-canonical-paths.js --strict
          python3 scripts/check_migration_links.py --manifest meta/migration-waves/b3c.json
          node --test tests/migration-wave.test.mjs
          node --test tests/migration-post-check.test.mjs
          npm run test:ci
          python3 - <<'PY'
          import hashlib, json, pathlib
          manifest = json.loads(pathlib.Path('meta/migration-waves/b3c.json').read_text())
          inventory = json.loads(pathlib.Path('meta/migration-inventory.json').read_text())
          moves = {item['source']: item for item in inventory['moves']}
          for asset in manifest['assets']:
              assert hashlib.sha256(pathlib.Path(asset['destination']).read_bytes()).hexdigest() == asset['pre_move_sha256']
              assert moves[asset['source']]['action'] == 'executed-move-with-legacy-pointer'
              assert '— Moved' in pathlib.Path(asset['source']).read_text()
          assert sum(1 for record in inventory['batch_execution_records'] if record.get('batch_id') == 'B3C') == 1
          print('B3C execution invariants: PASS')
          PY
      - name: Package exact changed files
        run: |
          git status --short
          git diff --name-only --diff-filter=ACMRTUXB > b3c-changed-files.txt
          test -s b3c-changed-files.txt
          tar -czf b3c-changes.tar.gz -T b3c-changed-files.txt
          sha256sum b3c-changes.tar.gz
      - name: Upload validated B3C change set
        uses: actions/upload-artifact@v4
        with:
          name: b3c-validated-change-set
          path: |
            b3c-changes.tar.gz
            b3c-changed-files.txt
          if-no-files-found: error
          retention-days: 1
