name: B3C Execution Change Set Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: write

jobs:
  patch-visual-comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply migration-aware visual comparison
        run: python3 scripts/b3c-visual-migration-patch-temp.py
      - name: Validate comparator diff
        run: |
          grep -F "build_migration_visual_aliases" .github/workflows/visual-regression-testing.yml
          grep -F "migration_legacy_pointer" .github/workflows/visual-regression-testing.yml
          git diff --check -- .github/workflows/visual-regression-testing.yml
      - name: Commit comparator only
        run: |
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/visual-regression-testing.yml
          git commit -m "fix: make visual comparison migration-aware"
          git push origin HEAD:feat/b3c-delivery-wave
