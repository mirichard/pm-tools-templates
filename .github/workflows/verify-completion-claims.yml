name: Acceptance and Status Reconciliation
on:
  schedule:
    - cron: '23 13 * * 1-5'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional issue number for acceptance-record inspection (never inferred from unrelated checks)'
        type: string
        default: ''
      preview:
        description: 'Generate evidence-gap report without updating the digest'
        type: boolean
        default: true
permissions:
  contents: read
  issues: write
jobs:
  reconcile:
    uses: ./.github/workflows/planning-review.yml
    with:
      preview: ${{ github.event_name == 'workflow_dispatch' && inputs.preview }}
      issue_number: ${{ inputs.issue_number || '' }}
    secrets:
      ROADMAP_PROJECT_TOKEN: ${{ secrets.ROADMAP_PROJECT_TOKEN }}
