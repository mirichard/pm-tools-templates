name: Build and Deploy Advanced Template Browser

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

# Keep Pages concurrency for deployments
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 1 }
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            site:
              - 'website/**'
              - 'docs/site/**'
              - 'site/**'
              - '.github/workflows/build-deploy-site.yml'

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.site == 'true' }}
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: CI timestamps
        run: |
          echo "run_started_at=${{ github.run_started_at }}"
          date -u +"now_utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Need full history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Astro 7 requires Node >=22.12. Keep the hosted build aligned with
          # the runtime validated by the current docs/site lockfile.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docs/site/package-lock.json'

      - name: Install root dependencies (timed)
        run: ./scripts/measure_step.sh "root install" -- bash -lc "if [ -f package-lock.json ]; then npm ci; else npm install; fi"

      - name: Install site dependencies (timed)
        working-directory: ./docs/site
        run: ../../scripts/measure_step.sh "site install" -- npm install --legacy-peer-deps

      - name: Generate changelogs (timed)
        run: ./scripts/measure_step.sh "changelogs" -- node scripts/generate-changelogs.mjs

      - name: Build site (timed)
        working-directory: ./docs/site
        run: ../../scripts/measure_step.sh "site build" -- npm run build --silent

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/site/dist

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gha-timings-build-site
          path: gha-timings/timings.jsonl
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages (timed)
        id: deployment
        run: ./scripts/measure_step.sh "deploy pages" -- bash -lc "echo 'Deploy via actions/deploy-pages@v5 is executed by the step metadata';"
      - name: Deployment action
        uses: actions/deploy-pages@v5
