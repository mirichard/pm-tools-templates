name: Build and Deploy Advanced Template Browser

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  workflow_run:
    workflows: [Weekly Backlog Triage Automation, Sprint Planning Preparation, Acceptance and Status Reconciliation]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Serialize production Pages deployments; validate each PR independently.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('site-pr-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.filter.outputs.site == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 1 }
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          filters: |
            site:
              - 'website/**'
              - 'docs/site/**'
              - 'templates/**'
              - 'domains/**'
              - 'project-lifecycle/**'
              - 'project-assessment-suite/**'
              - 'business-stakeholder-suite/**'
              - 'role-based-toolkits/**'
              - 'methodology-frameworks/**'
              - 'industry-specializations/**'
              - 'scripts/lib/site-template-catalog.mjs'
              - 'scripts/lib/content-repairs.mjs'
              - 'meta/content-repairs.json'
              - 'meta/migration-inventory.json'
              - 'meta/migration-waves/**'
              - 'scripts/generate-changelogs.mjs'
              - 'scripts/validate-site-output.py'
              - 'scripts/prepare-planning-site.cjs'
              - 'scripts/planning-review-model.cjs'
              - 'tests/site-template-catalog.test.mjs'
              - 'site/**'
              - '.github/workflows/build-deploy-site.yml'

  planning-data:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.site == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Prepare published planning review
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/prepare-planning-site.cjs > "$RUNNER_TEMP/planning-data.json"
          mv "$RUNNER_TEMP/planning-data.json" docs/site/public/planning-review/data.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: planning-site-data-${{ github.run_id }}
          path: docs/site/public/planning-review/data.json
          if-no-files-found: error
          retention-days: 14

  build:
    runs-on: ubuntu-latest
    needs: [changes, planning-data]
    if: ${{ !cancelled() && needs.changes.outputs.site == 'true' && (needs.planning-data.result == 'success' || github.event_name == 'pull_request') }}
    permissions:
      contents: read
    outputs:
      planning_run: ${{ steps.planning-metadata.outputs.source_run_id }}
    concurrency:
      group: site-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - name: CI timestamps
        run: |
          date -u +"now_utc=%Y-%m-%dT%H:%M:%SZ"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Need full history for changelog generation

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          # Astro 7 requires Node >=22.12. Keep the hosted build aligned with
          # the runtime validated by the current docs/site lockfile.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: 'docs/site/package-lock.json'

      - name: Install root dependencies (timed)
        run: ./scripts/measure_step.sh "root install" -- bash -lc "if [ -f package-lock.json ]; then npm ci; else npm install; fi"

      - name: Download validated planning publication data
        if: github.event_name != 'pull_request'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: planning-site-data-${{ github.run_id }}
          path: docs/site/public/planning-review/

      - name: Verify planning review model and view filters
        run: node --test tests/planning-review-model.test.cjs tests/planning-review-view.test.mjs tests/prepare-planning-site.test.cjs

      - name: Record planning edition for deployment verification
        id: planning-metadata
        run: node -e 'const fs=require("node:fs");const review=JSON.parse(fs.readFileSync("docs/site/public/planning-review/data.json","utf8"));fs.appendFileSync(process.env.GITHUB_OUTPUT,"source_run_id="+review.sourceRunId+"\n");'

      - name: Install site dependencies (timed)
        working-directory: ./docs/site
        run: ../../scripts/measure_step.sh "site install" -- npm install --legacy-peer-deps

      - name: Verify canonical site catalog
        run: node --test tests/site-template-catalog.test.mjs

      - name: Generate changelogs (timed)
        run: ./scripts/measure_step.sh "changelogs" -- node scripts/generate-changelogs.mjs

      - name: Build site (timed)
        working-directory: ./docs/site
        run: ../../scripts/measure_step.sh "site build" -- npm run build --silent

      - name: Verify built previews and downloads
        run: python3 scripts/validate-site-output.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs/site/dist

      - name: Upload timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gha-timings-build-site
          path: gha-timings/timings.jsonl
          retention-days: 7

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the published planning page and data
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_RUN: ${{ needs.build.outputs.planning_run }}
        with:
          script: |
            const base = new URL(process.env.PAGE_URL);
            if (base.origin !== 'https://mirichard.github.io' || !/^[0-9]+$/.test(process.env.EXPECTED_RUN)) throw new Error('Invalid planning publication target');
            const page = new URL('planning-review/', base);
            for (let attempt = 0; attempt < 12; attempt++) {
              try {
                const data = await fetch(new URL('data.json?run=' + process.env.EXPECTED_RUN, page), {signal: AbortSignal.timeout(15000)});
                const html = await fetch(page, {signal: AbortSignal.timeout(15000)});
                if (data.ok && html.ok && String((await data.json()).sourceRunId) === process.env.EXPECTED_RUN && (await html.text()).includes('Planning review')) {
                  await core.summary.addLink('Open planning review', page.href).write();
                  return;
                }
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The expected planning edition is not yet accessible at the published URL');
