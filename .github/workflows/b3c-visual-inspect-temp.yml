name: B3C Visual Comparator Inspection Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: read

jobs:
  inspect-comparator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print visual comparison block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/visual-regression-testing.yml')
          lines = p.read_text().splitlines()
          needles = ('current_screenshots =', 'baseline_lookup', 'baseline_file =', 'Visual Comparison')
          hits = [i for i, line in enumerate(lines) if any(n in line for n in needles)]
          if not hits:
              raise SystemExit('comparison block anchors not found')
          start = max(0, min(hits) - 35)
          end = min(len(lines), max(hits) + 90)
          for i in range(start, end):
              print(f'{i+1:04d}: {lines[i]}')
          PY
