name: Web MVP Accessibility (axe)

on:
  pull_request:
  push:
    branches: [ main, master ]

jobs:
  a11y:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-mvp
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-mvp/package.json

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run axe a11y tests
        run: npm run test:a11y

      - name: Test principle self-assessment journeys and accessibility
        run: npx playwright test tests/principles-assessment.spec.ts

      - name: Preserve principle worksheet visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: principles-assessment-preview
          path: web-mvp/test-results/**/principles-*.png
          if-no-files-found: ignore
