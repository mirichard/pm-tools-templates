name: 🏥 Workflow Health Improvements

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-health.sh'
      - 'tests/test_workflow_health.py'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'scripts/check-workflow-health.sh'
      - 'tests/test_workflow_health.py'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: health-improvements-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  workflow-syntax:
    name: Validate Actions syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install verified actionlint
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$tool_dir"
          curl --fail --silent --show-error --location --retry 3 --connect-timeout 10 --max-time 60 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$tool_dir/actionlint.tar.gz"
          echo "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  $tool_dir/actionlint.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          echo "$tool_dir" >> "$GITHUB_PATH"
      - name: Test failure propagation
        run: python3 -m unittest discover -s tests -p test_workflow_health.py -v
      - name: Validate executable workflow syntax
        run: bash scripts/check-workflow-health.sh lint
      - name: Upload syntax report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-syntax-report
          path: health-reports/actionlint.txt
          retention-days: 14
          if-no-files-found: warn

  dependency-health-check:
    name: Audit root runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Audit root runtime dependencies
        run: bash scripts/check-workflow-health.sh audit
        env:
          npm_config_fetch_retries: '1'
          npm_config_fetch_timeout: '30000'
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: root-runtime-dependency-audit
          path: health-reports/npm-audit.json
          retention-days: 14
          if-no-files-found: warn
