name: Validate Curated Templates

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Use Node.js 20
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install dependencies (none required)
        run: |
          echo "No repo-level install needed for validator"

      - name: Validate templates/templates.json
        run: node scripts/validate-curated-templates.js

      - name: Test catalog domain resolution
        run: node --test tests/catalog-domains.test.cjs
