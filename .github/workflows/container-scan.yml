name: Container Image Scan

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'ai-insights/Dockerfile'
      - 'ai-insights/package.json'
      - 'ai-insights/package-lock.json'
      - '.github/workflows/container-scan.yml'
  pull_request:
    paths:
      - 'ai-insights/Dockerfile'
      - 'ai-insights/package.json'
      - 'ai-insights/package-lock.json'
      - '.github/workflows/container-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Scan ai-insights image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ai-insights image
        run: docker build -t ai-insights:scan ./ai-insights

      # v0.28.0 (my first fix attempt, correcting a missing "v" prefix) does
      # resolve but pulls a broken nested dependency
      # (aquasecurity/setup-trivy@v0.2.1, which itself doesn't resolve) -
      # confirmed by actually running it, not by re-guessing from memory.
      # v0.33.1 is confirmed to exist via
      # https://github.com/aquasecurity/trivy-action/releases; verify this
      # resolves cleanly via this push's CI before trusting it further.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: ai-insights:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
