name: Container Image Scan

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the required status while the sole configured image is withdrawn.
  # Reintroducing the app must also restore image build and vulnerability scanning.
  scan-gate:
    name: Container scan gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify withdrawn image is absent
        shell: bash
        run: |
          if [[ -n "$(git ls-files -- ai-insights)" ]]; then
            echo '::error::AI insights has returned; restore its image build and vulnerability scan before merging.'
            exit 1
          fi
          echo 'Container scan not applicable: the configured AI insights image is withdrawn.'
