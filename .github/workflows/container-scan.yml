name: Container Image Scan

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Triggers on every push/PR (round-6 QA finding F3: a path-filtered
  # *trigger* means this workflow never runs at all on an inapplicable PR,
  # which leaves a required check permanently "waiting to be reported" -
  # not the same as a job being skipped, which GitHub's required-checks
  # logic treats as satisfied). Applicability is decided here as a job
  # output instead, and scan-gate below always reports a real conclusion.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      applicable: ${{ steps.filter.outputs.ai-insights }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ai-insights: [ 'ai-insights/**', '.github/workflows/container-scan.yml' ]

  trivy:
    name: Scan ai-insights image
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build ai-insights image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p container-evidence
          git rev-parse HEAD > container-evidence/checkout-sha.txt
          docker build --iidfile container-evidence/image-id.txt -t ai-insights:scan ./ai-insights 2>&1 | tee container-evidence/build.log
          image_id=$(cat container-evidence/image-id.txt)
          echo "image_id=$image_id" >> "$GITHUB_OUTPUT"
          docker image inspect "$image_id" > container-evidence/image.json

      - name: Check container runtime
        run: bash ai-insights/scripts/container-smoke.sh '${{ steps.build.outputs.image_id }}' container-evidence

      # Root cause of an earlier failure, from this PR's own job logs (run
      # 35618428368, job 106395074000): trivy-action@v0.33.1's own install
      # step ran `trivy/contrib/install.sh ... v0.65.0` and failed with
      # "aquasecurity/trivy crit unable to find 'v0.65.0'" - that action
      # release's baked-in default Trivy CLI version does not exist in
      # aquasecurity/trivy's own release list (confirmed against
      # https://github.com/aquasecurity/trivy/releases and Docker Hub's
      # aquasec/trivy tags, both checked directly, not inferred from
      # unrelated upstream issue reports). Fix: pin the action to its
      # current release (v0.36.0) and pass `version:` explicitly so this
      # step never again depends on an action release's undocumented
      # default Trivy CLI version. Confirmed working end-to-end (run
      # 35630381761): completed a real scan and found 4 real HIGH CVEs.
      - name: Scan image with Trivy
        if: always() && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.build.outputs.image_id }}
          version: v0.74.0
          format: json
          output: container-evidence/trivy.json
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Save container evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: container-evidence/
          if-no-files-found: error
          retention-days: 30

  # The one required status check for this workflow. Always runs, and
  # distinguishes three outcomes explicitly: legitimately not applicable
  # (no ai-insights/** change, not a push) -> passes; change detection
  # itself failed -> fails; the scan ran and found CRITICAL/HIGH findings,
  # or never produced a result at all -> fails. A skipped `trivy` job is
  # never silently treated as a pass here.
  scan-gate:
    name: Container scan gate
    needs: [changes, trivy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Evaluate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.applicable }}
          EVENT_NAME: ${{ github.event_name }}
          WORK_RESULT: ${{ needs.trivy.result }}
          WORK_LABEL: "container scan (no ai-insights/** change)"
        run: bash scripts/applicability-gate.sh
