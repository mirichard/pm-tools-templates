name: Container Image Scan

on:
  push:
    branches: [ main, staging, develop ]
    paths:
      - 'ai-insights/Dockerfile'
      - 'ai-insights/package.json'
      - 'ai-insights/package-lock.json'
      - '.github/workflows/container-scan.yml'
  pull_request:
    paths:
      - 'ai-insights/Dockerfile'
      - 'ai-insights/package.json'
      - 'ai-insights/package-lock.json'
      - '.github/workflows/container-scan.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy:
    name: Scan ai-insights image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build ai-insights image
        run: docker build -t ai-insights:scan ./ai-insights

      # Corrected from a nonexistent "0.28.0" tag (missing the required "v"
      # prefix - confirmed against https://github.com/aquasecurity/trivy-action/releases,
      # this action's own tags are v-prefixed). Left as a verified tag rather
      # than a SHA: I could not independently verify a commit SHA for this
      # action through the tools available in this session, and guessing one
      # would repeat the exact mistake being fixed here.
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: ai-insights:scan
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
