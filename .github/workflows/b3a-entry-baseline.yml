name: B3A Entry Baseline

on:
  push:
    branches:
      - feat/b3a-delivery-wave
    paths:
      - .github/workflows/b3a-entry-baseline.yml

permissions:
  contents: read

jobs:
  main-metadata-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Reproduce generator drift on main
        run: |
          test "$(git rev-parse HEAD)" = "f639e285ec3970372f1fa1166b4af07d371e7fb8"
          node scripts/generate-sprint-10-metadata.mjs
          echo '--- generated files changed on main ---'
          git diff --name-only
          echo '--- generated diff SHA-256 ---'
          git diff --binary | sha256sum

  b3a-baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout B3A branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate migration tooling and entry manifest
        run: |
          node --test tests/migration-wave.test.mjs
          python3 -m unittest tests.test_migration_links
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3a.json

      - name: Run structural validators on committed entry state
        run: |
          node scripts/validate-sprint-10.mjs --require-annotations
          node scripts/validate-curated-templates.js
          node scripts/validate-canonical-paths.js --strict

      - name: Establish B3A migration-link baseline
        run: python3 scripts/check_migration_links.py --manifest meta/migration-waves/b3a.json

      - name: Run CI test suite
        run: npm run test:ci

      - name: Verify entry assets still untouched
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const plan = JSON.parse(fs.readFileSync('meta/migration-waves/b3a.json', 'utf8'));
          let failures = 0;
          for (const asset of plan.assets) {
            if (!fs.existsSync(asset.source)) { console.error(`missing source: ${asset.source}`); failures++; continue; }
            if (fs.existsSync(asset.destination)) { console.error(`destination already exists: ${asset.destination}`); failures++; }
            const hash = crypto.createHash('sha256').update(fs.readFileSync(asset.source)).digest('hex');
            if (hash !== asset.pre_move_sha256) { console.error(`hash drift: ${asset.source}`); failures++; }
          }
          if (failures) process.exit(1);
          console.log(`PASS: ${plan.asset_count}/${plan.asset_count} entry sources match recorded hashes; 0 destination collisions.`);
          NODE

      - name: Report branch generator drift without failing baseline
        run: |
          node scripts/generate-sprint-10-metadata.mjs
          echo '--- generated files changed on B3A entry branch ---'
          git diff --name-only
          echo '--- generated diff SHA-256 ---'
          git diff --binary | sha256sum
