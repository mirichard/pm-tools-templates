name: Template Analytics & Usage Tracking

on:
  issues:
    types: [opened, edited, labeled]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: Generate artifacts without publishing issue reports
        type: boolean
        default: true
  pull_request:
    paths:
      - '.github/workflows/template-analytics.yml'
      - '.github/ISSUE_TEMPLATE/template-rating.yml'
      - 'scripts/template-analytics.cjs'
      - 'tests/template-analytics.test.cjs'

permissions:
  contents: read

concurrency:
  group: template-analytics-${{ github.event.issue.number || github.event.pull_request.number || 'reports' }}
  cancel-in-progress: false

jobs:
  test-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: node --test tests/template-analytics.test.cjs

  track-template-usage:
    needs: test-analytics
    if: >-
      github.event_name == 'issues' &&
      contains(github.event.issue.labels.*.name, 'template-rating') &&
      (github.event.action == 'opened' || github.event.action == 'edited' ||
       (github.event.action == 'labeled' && github.event.label.name == 'template-rating'))
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            await require('./scripts/template-analytics.cjs').track({github, context});

  generate-analytics-report:
    needs: test-analytics
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate rating reports
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const analytics = require('./scripts/template-analytics.cjs');
            const publish = analytics.shouldPublish(context);
            await analytics.reports({github, context, publish});
            core.summary.addRaw(publish ? 'Rating reports published.' : 'Preview only: no issue reports published.');
            await core.summary.write();
      - name: Retain report evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: template-analytics-reports
          path: analytics-reports/*.md
          retention-days: 14
          if-no-files-found: warn
