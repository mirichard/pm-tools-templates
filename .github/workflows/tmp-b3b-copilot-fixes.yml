name: Temporary B3B Copilot Fixes

on:
  push:
    branches:
      - feat/b3b-delivery-wave
    paths:
      - .github/workflows/tmp-b3b-copilot-fixes.yml

permissions:
  contents: write

jobs:
  patch-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: feat/b3b-delivery-wave

      - name: Guard branch and canonical README links
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "feat/b3b-delivery-wave"
          grep -Fq '../../domains/delivery/industry-specializations/healthcare-pharmaceutical/regulatory/regulatory_strategy_plan_template.md' industry-specializations/healthcare-pharmaceutical/README.md
          grep -Fq '../../domains/delivery/industry-specializations/healthcare-pharmaceutical/regulatory/compliance_risk_assessment_template.md' industry-specializations/healthcare-pharmaceutical/README.md

      - name: Canonicalize executed B3A dependency edge
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('meta/migration-inventory.json')
          data = json.loads(path.read_text())
          source = 'industry-specializations/healthcare-pharmaceutical/manufacturing/process_control_template.md'
          old = 'industry-specializations/healthcare-pharmaceutical/validation/computer_system_validation_protocol_template.md'
          new = 'domains/delivery/industry-specializations/healthcare-pharmaceutical/regulatory/computer_system_validation_protocol_template.md'

          matches = [m for m in data['moves'] if m['source'] == source]
          assert len(matches) == 1, f'expected one process-control move, found {len(matches)}'
          move = matches[0]
          deps = move['dependencies']
          assert deps.count(old) == 1, f'expected exactly one stale dependency, found {deps.count(old)}'
          assert new not in deps, 'canonical dependency already present unexpectedly'
          move['dependencies'] = [new if d == old else d for d in deps]

          path.write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Verify scoped diff
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          test "$changed" = "meta/migration-inventory.json"
          grep -Fq 'domains/delivery/industry-specializations/healthcare-pharmaceutical/regulatory/computer_system_validation_protocol_template.md' meta/migration-inventory.json

      - name: Commit and push inventory correction
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add meta/migration-inventory.json
          git commit -m 'fix(b3b): canonicalize migrated inventory dependency'
          git push origin HEAD:feat/b3b-delivery-wave
