name: B3C Planner Temporary

on:
  push:
    branches:
      - feat/b3c-delivery-wave

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate B3C planner output
        run: |
          node scripts/plan-migration-wave.mjs \
            --wave-id B3C \
            --batch 3 \
            --domain Delivery \
            --rollback-owner mirichard \
            --max-assets 12 \
            --pre-batch-sha b29500895cc57cb80016b5bf723dd0960a81b4b0 \
            --output /tmp/b3c.json
          echo '--- B3C PLAN START ---'
          cat /tmp/b3c.json
          echo '--- B3C PLAN END ---'
