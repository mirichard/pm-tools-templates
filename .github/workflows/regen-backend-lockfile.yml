name: Regenerate template-selector/backend lock file

on:
  workflow_dispatch:

jobs:
  regen-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate package-lock.json
        run: npm install
        working-directory: "PM Tools Templates - Q3 2025 Delivery Cycle/Implementation/template-selector/backend"

      - name: Commit updated lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "PM Tools Templates - Q3 2025 Delivery Cycle/Implementation/template-selector/backend/package-lock.json"
          git diff --cached --quiet || git commit -m "chore(deps): regenerate template-selector/backend lock file

Pins flatted ^3.4.2 via package.json overrides to resolve
Dependabot alert #284 (HIGH - prototype pollution).

Co-Authored-By: Oz <oz-agent@warp.dev>"
          git push
# end
