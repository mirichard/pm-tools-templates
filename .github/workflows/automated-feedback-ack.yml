name: Submission Receipt

on:
  issues:
    types: [opened]

jobs:
  automated-response:
    if: ${{ !contains(github.event.issue.labels.*.name, 'security') }}
    permissions:
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Post receipt
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.payload.issue.number;
            const acknowledgmentComment = `
            ## Submission received

            This confirms receipt only; it does not confirm acceptance, priority,
            scheduling, or publication. A maintainer will record a disposition
            and next action when triage is complete.

            This issue is public. Do not add confidential, personal, proprietary,
            or identifying information. Read the
            [submission handling guide](https://github.com/mirichard/pm-tools-templates/blob/main/docs/community/submission-handling.md).
            `;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: acknowledgmentComment
            });
