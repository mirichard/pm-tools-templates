name: Update Release Draft

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repository-release-metadata
  cancel-in-progress: false

jobs:
  update_release_draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          persist-credentials: false

      - name: Validate release management
        run: |
          python3 scripts/release_management.py
          python3 -m unittest discover -s tests -p 'test_release_management.py' -v
      - name: Reconcile release identity and draft
        run: python3 scripts/release_management.py --apply
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
