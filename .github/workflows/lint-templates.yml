name: Template Metadata Linter

on:
  pull_request:
    paths:
      - '**/*.md'
      - 'templates/templates.json'
      - 'meta/migration-waves/*.json'
      - 'scripts/lint_template_metadata.py'
      - 'scripts/template_reviews.py'
      - 'scripts/check_migrated_freshness.py'
      - 'tests/test_migrated_freshness.py'
      - 'tests/webhook-example.test.cjs'
      - 'meta/migration-inventory.json'
      - 'meta/template-content-reviews.json'
      - 'tests/test_template_reviews.py'
      - 'tests/test_template_metadata.py'
      - 'scripts/quality_gate_baseline.py'
      - 'scripts/migration_pointer.py'
      - 'tests/test_quality_gate_baseline.py'
      - 'scripts/validate-status-output.py'
      - 'scripts/generate-status-email.sh'
      - 'tests/test_clean_status.py'
      - '.github/workflows/lint-templates.yml'
      - '.github/workflows/clean-status-workflow.yml'
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'templates/templates.json'
      - 'meta/migration-waves/*.json'
      - 'scripts/lint_template_metadata.py'
      - 'scripts/template_reviews.py'
      - 'scripts/check_migrated_freshness.py'
      - 'tests/test_migrated_freshness.py'
      - 'tests/webhook-example.test.cjs'
      - 'meta/migration-inventory.json'
      - 'meta/template-content-reviews.json'
      - 'tests/test_template_reviews.py'
      - 'tests/test_template_metadata.py'
      - 'scripts/quality_gate_baseline.py'
      - 'scripts/migration_pointer.py'
      - 'tests/test_quality_gate_baseline.py'
      - 'scripts/validate-status-output.py'
      - 'scripts/generate-status-email.sh'
      - 'tests/test_clean_status.py'
      - '.github/workflows/lint-templates.yml'
      - '.github/workflows/clean-status-workflow.yml'

permissions:
  contents: read

jobs:
  lint-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tested head with comparison history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Test metadata policy and safe report generation
        run: |
          python -m unittest tests.test_template_metadata tests.test_template_reviews tests.test_migrated_freshness -v
          python -m unittest tests.test_quality_gate_baseline -v
          python -m unittest discover -s tests -p test_clean_status.py -v
      - name: Require zero migrated-template age warnings
        run: python scripts/check_migrated_freshness.py --json-output migrated-freshness.json
      - name: Validate changed bodies and navigation; report inherited debt
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: >-
          python scripts/lint_template_metadata.py
          --base "$BASE_SHA" --head "$HEAD_SHA" --event "$EVENT_NAME"
          --json-output metadata-validation.json
      - name: Require zero age warnings across the linter scope
        run: |
          python - <<'PYCODE'
          import json
          import sys
          result = json.load(open('metadata-validation.json'))
          print(f"Repository age warnings: {len(result['warnings'])}")
          sys.exit(bool(result['warnings']))
          PYCODE
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify documented webhook signature example
        run: node --test tests/webhook-example.test.cjs
      - name: Preserve denominator and inherited-debt evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: metadata-validation
          path: |
            metadata-validation.json
            migrated-freshness.json
          if-no-files-found: error
          retention-days: 7
