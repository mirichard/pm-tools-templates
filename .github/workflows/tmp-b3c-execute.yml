name: Temporary B3C Execution

on:
  push:
    branches:
      - feat/b3c-delivery-wave
    paths:
      - .github/workflows/tmp-b3c-execute.yml

permissions:
  contents: write
  issues: read

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm ci
      - name: Guard authoritative entry state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin main feat/b3c-delivery-wave
          test "$(git rev-parse origin/main)" = "b29500895cc57cb80016b5bf723dd0960a81b4b0"
          test "$(gh issue view 1057 --repo mirichard/pm-tools-templates --json state --jq .state)" = "OPEN"
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3c.json
          node scripts/migration-post-check.mjs
          node scripts/generate-sprint-10-metadata.mjs
          git diff --exit-code -- meta/cross-references.json meta/migration-inventory.json
          python3 - <<'PY'
          import json
          m=json.load(open('meta/migration-waves/b3c.json'))
          inv=json.load(open('meta/migration-inventory.json'))
          assert m['wave_id']=='B3C' and m['asset_count']==10 and m['phase']=='entry'
          assert m['pre_batch_sha']=='b29500895cc57cb80016b5bf723dd0960a81b4b0'
          selected={a['source'] for a in m['assets']}
          records=[x for x in inv['moves'] if x.get('source') in selected]
          assert len(records)==10
          assert all(x.get('action')=='planned-move-not-executed' for x in records)
          assert not any(x.get('batch_id')=='B3C' for x in inv['batch_execution_records'])
          print('B3C entry guard PASS')
          PY
      - name: Execute B3C moves
        run: |
          set -euo pipefail
          python3 scripts/tmp-b3c-execute.py
          node scripts/generate-sprint-10-metadata.mjs
      - name: Validate executed state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh issue view 1057 --repo mirichard/pm-tools-templates --json state --jq .state)" = "OPEN"
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3c.json
          node scripts/migration-post-check.mjs
          node scripts/generate-sprint-10-metadata.mjs
          git diff --exit-code -- meta/cross-references.json meta/migration-inventory.json
          node scripts/validate-sprint-10.mjs --require-annotations
          node scripts/validate-curated-templates.js
          node scripts/validate-canonical-paths.js --strict
          python3 scripts/check_migration_links.py --manifest meta/migration-waves/b3c.json
          node --test tests/migration-wave.test.mjs
          node --test tests/migration-post-check.test.mjs
          python3 -m unittest tests.test_migration_links
          npm run test:ci
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          m=json.load(open('meta/migration-waves/b3c.json'))
          cat=json.load(open('templates/templates.json'))
          inv=json.load(open('meta/migration-inventory.json'))
          assert m['phase']=='executed' and m['asset_count']==10
          assert sum(1 for x in inv['batch_execution_records'] if x.get('batch_id')=='B3C') == 1
          selected={a['source'] for a in m['assets']}
          records={x['source']:x for x in inv['moves'] if x.get('source') in selected}
          assert len(records)==10
          canonical_by_path={x.get('path'):x for x in cat.get('templates', [])}
          for a in m['assets']:
              src=Path(a['source']); dst=Path(a['destination'])
              assert src.is_file() and dst.is_file()
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==a['pre_move_sha256']
              text=src.read_text()
              assert '— Moved' in text and '**Canonical location:**' in text
              rel=os.path.relpath(dst,start=src.parent).replace(os.sep,'/')
              assert f']({rel})' in text
              rec=records[a['source']]
              assert rec['action']=='executed-move-with-legacy-pointer'
              assert rec['execution']['batch_id']=='B3C'
              assert a['source'] in canonical_by_path[a['destination']].get('alternate_paths', [])
          print('B3C executed-state integrity PASS: 10/10')
          PY
      - name: Commit B3C execution
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-b3c-execute.yml .github/workflows/b3c-entry-temp.yml scripts/tmp-b3c-execute.py
          git add -A
          mapfile -t excludes < <(python3 - <<'PY'
          import json
          m=json.load(open('meta/migration-waves/b3c.json'))
          for a in m['assets']:
              print(':(exclude)' + a['destination'])
          PY
          )
          git diff --cached --check -- . "${excludes[@]}"
          git commit -m 'refactor: migrate B3C Delivery-domain assets'
          git push origin HEAD:feat/b3c-delivery-wave
