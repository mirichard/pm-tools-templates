name: Temporary B3B Manifest Persistence

on:
  push:
    branches:
      - feat/b3b-delivery-wave
    paths:
      - .github/workflows/tmp-b3b-plan.yml

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard authoritative base
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "6b270df6e533f2f2c69fab37cecdc5c2b0ca01c1"

      - name: Generate and validate manifest
        run: |
          set -euo pipefail
          mkdir -p meta/migration-waves
          node scripts/plan-migration-wave.mjs \
            --wave-id B3B \
            --batch 3 \
            --domain Delivery \
            --rollback-owner mirichard \
            --pre-batch-sha 6b270df6e533f2f2c69fab37cecdc5c2b0ca01c1 \
            --output meta/migration-waves/b3b.json
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3b.json
          python3 - <<'PY'
          import json
          m=json.load(open('meta/migration-waves/b3b.json'))
          assert m['asset_count']==11, m['asset_count']
          assert m['phase']=='entry'
          assert m['pre_batch_sha']=='6b270df6e533f2f2c69fab37cecdc5c2b0ca01c1'
          print('B3B manifest guard PASS: 11 assets')
          PY

      - name: Commit only manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/migration-waves/b3b.json
          test "$(git diff --cached --name-only)" = "meta/migration-waves/b3b.json"
          git commit -m "docs(migration): record B3B entry manifest"
          git push origin HEAD:feat/b3b-delivery-wave
