name: Temporary B3B Execution

on:
  push:
    branches:
      - feat/b3b-delivery-wave
    paths:
      - .github/workflows/tmp-b3b-plan.yml

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Guard authoritative state
        run: |
          set -euo pipefail
          git fetch origin main feat/b3b-delivery-wave
          test "$(git rev-parse origin/main)" = "6b270df6e533f2f2c69fab37cecdc5c2b0ca01c1"
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3b.json
          python3 - <<'PY'
          import json
          m=json.load(open('meta/migration-waves/b3b.json'))
          inv=json.load(open('meta/migration-inventory.json'))
          assert m['wave_id']=='B3B' and m['asset_count']==11 and m['phase']=='entry'
          assert m['pre_batch_sha']=='6b270df6e533f2f2c69fab37cecdc5c2b0ca01c1'
          selected={a['source'] for a in m['assets']}
          records=[x for x in inv['moves'] if x.get('source') in selected]
          assert len(records)==11
          assert all(x.get('action')=='planned-move-not-executed' for x in records)
          assert not any(x.get('batch_id')=='B3B' for x in inv['batch_execution_records'])
          print('B3B entry guard PASS')
          PY

      - name: Execute B3B moves and metadata transition
        run: |
          set -euo pipefail
          python3 scripts/tmp-b3b-execute.py

      - name: Validate executed state
        run: |
          set -euo pipefail
          node scripts/validate-migration-wave.mjs --manifest meta/migration-waves/b3b.json
          node --test tests/migration-wave.test.mjs
          python3 -m unittest tests.test_migration_links
          node scripts/validate-curated-templates.js
          node scripts/validate-canonical-paths.js
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          m=json.load(open('meta/migration-waves/b3b.json'))
          cat=json.load(open('templates/templates.json'))
          inv=json.load(open('meta/migration-inventory.json'))
          assert m['phase']=='executed' and m['asset_count']==11
          assert sum(1 for x in inv['batch_execution_records'] if x.get('batch_id')=='B3B') == 1
          selected={a['source'] for a in m['assets']}
          records={x['source']:x for x in inv['moves'] if x.get('source') in selected}
          assert len(records)==11
          canonical_by_path={x.get('path'):x for x in cat.get('templates', [])}
          for a in m['assets']:
              src=Path(a['source']); dst=Path(a['destination'])
              assert src.is_file() and dst.is_file()
              assert hashlib.sha256(dst.read_bytes()).hexdigest()==a['pre_move_sha256']
              s=src.read_text()
              assert '— Moved' in s and '**Canonical location:**' in s
              rel=os.path.relpath(dst,start=src.parent).replace(os.sep,'/')
              assert f']({rel})' in s
              rec=records[a['source']]
              assert rec['action']=='executed-move-with-legacy-pointer'
              assert rec['execution']['batch_id']=='B3B'
              assert a['source'] in canonical_by_path[a['destination']].get('alternate_paths', [])
          def no_nested_alts(obj):
              if isinstance(obj, dict):
                  assert 'alternate_paths' not in obj
                  for v in obj.values(): no_nested_alts(v)
              elif isinstance(obj, list):
                  for v in obj: no_nested_alts(v)
          for template in cat.get('templates', []):
              for k,v in template.items():
                  if k != 'alternate_paths': no_nested_alts(v)
          print('B3B executed-state integrity PASS: 11/11')
          PY

      - name: Commit B3B execution
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-b3b-plan.yml scripts/tmp-b3b-execute.py
          git add -A
          mapfile -t excludes < <(python3 - <<'PY'
          import json
          m=json.load(open('meta/migration-waves/b3b.json'))
          for a in m['assets']:
              print(':(exclude)' + a['destination'])
          PY
          )
          git diff --cached --check -- . "${excludes[@]}"
          git commit -m "refactor: migrate B3B Delivery-domain assets"
          git push origin HEAD:feat/b3b-delivery-wave
