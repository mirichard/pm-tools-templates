name: Weekly triage regression tests

on:
  pull_request:
    paths:
      - '.github/workflows/weekly-triage-automation.yml'
      - '.github/workflows/weekly-triage-tests.yml'
      - 'tests/weekly-triage.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: node --test tests/weekly-triage.test.cjs
