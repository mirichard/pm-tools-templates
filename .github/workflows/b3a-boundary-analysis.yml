name: B3A Boundary Analysis

on:
  push:
    branches:
      - feat/b3a-delivery-wave
    paths:
      - .github/workflows/b3a-boundary-analysis.yml

permissions:
  contents: write

jobs:
  persist-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/b3a-delivery-wave

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify expected branch state
        run: |
          test "$(git branch --show-current)" = "feat/b3a-delivery-wave"
          git merge-base --is-ancestor f639e285ec3970372f1fa1166b4af07d371e7fb8 HEAD

      - name: Generate and validate B3A entry manifest
        run: |
          node --test tests/migration-wave.test.mjs
          node scripts/plan-migration-wave.mjs \
            --wave-id B3A \
            --batch 3 \
            --domain Delivery \
            --rollback-owner mirichard \
            --pre-batch-sha f639e285ec3970372f1fa1166b4af07d371e7fb8 \
            --output meta/migration-waves/b3a.json
          node scripts/validate-migration-wave.mjs \
            --manifest meta/migration-waves/b3a.json

      - name: Persist only the validated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta/migration-waves/b3a.json
          test "$(git diff --cached --name-only)" = "meta/migration-waves/b3a.json"
          git commit -m "chore(b3a): record validated entry manifest"
          git push origin HEAD:feat/b3a-delivery-wave
