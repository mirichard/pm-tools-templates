name: Integration OAuth Check

on:
  push:
    branches: [ main, staging, develop ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-oauth-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same fix as container-scan.yml (round-6 QA finding F3): trigger on
  # every push/PR rather than path-filtering the trigger itself, so this
  # never becomes a required check stuck "waiting to be reported" on an
  # unrelated PR. Applicability is a job output instead.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      applicable: ${{ steps.filter.outputs.jira-asana-sync }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            jira-asana-sync: [ 'integrations/jira-asana-sync/**', '.github/workflows/integration-oauth-check.yml' ]

  oauth-check:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.applicable == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/jira-asana-sync
    env:
      NODE_ENV: test
      LOG_LEVEL: warn
      DRY_RUN: 'true'
      # Jira secrets expected to exist in repo/org secrets
      JIRA_CLIENT_ID: ${{ secrets.JIRA_CLIENT_ID }}
      JIRA_CLIENT_SECRET: ${{ secrets.JIRA_CLIENT_SECRET }}
      JIRA_CLOUD_SCOPES: read:jira-user,read:jira-work
      JIRA_REDIRECT_URI: ${{ secrets.JIRA_REDIRECT_URI }}
      # Asana secrets are optional; job step will be skipped if not present
      ASANA_CLIENT_ID: ${{ secrets.ASANA_CLIENT_ID }}
      ASANA_CLIENT_SECRET: ${{ secrets.ASANA_CLIENT_SECRET }}
      ASANA_SCOPES: default
      ASANA_REDIRECT_URI: ${{ secrets.ASANA_REDIRECT_URI }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: integrations/jira-asana-sync/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type check and build
        run: |
          npm run build

      - name: Run unit tests (no coverage)
        run: |
          npm test -- --coverage=false || npm test

      # The two steps below are the only ones that touch secrets, and they
      # are already optional/best-effort (a missing credential just skips
      # the step) - required build/test coverage above does not depend on
      # any secret being present.
      - name: Dry-run authorize URL (Jira)
        if: env.JIRA_CLIENT_ID != '' && env.JIRA_CLIENT_SECRET != '' && env.JIRA_REDIRECT_URI != ''
        run: |
          npm run dev -- --provider=jira --dry-run

      - name: Dry-run authorize URL (Asana) — optional
        if: env.ASANA_CLIENT_ID != '' && env.ASANA_CLIENT_SECRET != '' && env.ASANA_REDIRECT_URI != ''
        run: |
          npm run dev -- --provider=asana --dry-run

  # The one required status check for this workflow - see container-scan.yml's
  # scan-gate for the same reasoning.
  oauth-gate:
    name: Integration OAuth check gate
    needs: [changes, oauth-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Evaluate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APPLICABLE: ${{ needs.changes.outputs.applicable }}
          EVENT_NAME: ${{ github.event_name }}
          WORK_RESULT: ${{ needs.oauth-check.result }}
          WORK_LABEL: "integration OAuth check (no integrations/jira-asana-sync/** change)"
        run: bash scripts/applicability-gate.sh
