name: Issue type validation

on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      preview:
        description: Report classification gaps without changing issues
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      numbers: ${{ steps.select.outputs.numbers }}
      preview: ${{ steps.select.outputs.preview }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Issue/schedule events use the default branch commit; a maintainer
          # may explicitly dispatch a reviewed branch to test before merge.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: select
        with:
          script: |
            const policy = require('./scripts/issue-types.cjs');
            const preview = context.eventName === 'workflow_dispatch' &&
              context.payload.inputs?.preview !== 'false';
            const numbers = await policy.targets({github, context});
            if (!preview) await policy.ensureLabels(github, context.repo);
            core.setOutput('numbers', JSON.stringify(numbers));
            core.setOutput('preview', String(preview));
            await core.summary.addRaw(`Selected ${numbers.length} open issue(s). Preview: ${preview}.`).write();

  classify:
    needs: targets
    if: needs.targets.outputs.numbers != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        number: ${{ fromJSON(needs.targets.outputs.numbers) }}
    # Event and sweep jobs for the same issue share a lock. Replacement of a
    # pending job is safe because the latest job re-reads current issue state.
    concurrency:
      group: issue-type-${{ github.repository }}-${{ matrix.number }}-${{ needs.targets.outputs.preview }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          ISSUE_NUMBER: ${{ matrix.number }}
          PREVIEW: ${{ needs.targets.outputs.preview }}
        with:
          script: |
            await require('./scripts/issue-types.cjs').run({
              github, context, core, bootstrap: false,
              number: Number(process.env.ISSUE_NUMBER),
              preview: process.env.PREVIEW !== 'false'
            });
